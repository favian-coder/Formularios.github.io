<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Datos</title>
</head>
<body>

<h1>Registro de Datos</h1>

<form action="#" method="post">

<label for="nombre">Nombre:</label>
<input type="text" id="nombre" name="nombre" placeholder="Ej: Carolina"
pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras y espacios" required>

<label for="apellido">Apellido:</label>
<input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez"
pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras y espacios" required><br><br>

<label for="edad">Edad:</label>
<input type="number" id="edad" name="edad" min="1" max="120" required>

<label for="otro_eje_edad">Otro Eje Edad:</label>
<input type="range" id="otro_eje_edad" name="otro_eje_edad" min="0" max="100" step="1" value="25"><br><br>

<label for="fecha_nac">Fecha de Nacimiento:</label>
<input type="date" id="fecha_nac" name="fecha_nac" min="1900-01-01" max="2026-12-31" required><br><br>

<label for="cedula">Cédula:</label>
<input type="text" id="cedula" name="cedula" placeholder="Ej: V-15248312"
pattern="^[VE]-\d{5,9}$" title="Formato: V-12345678 o E-9876543" required><br><br>

<label for="telefono">Teléfono:</label>
<input type="text" id="telefono" name="telefono" placeholder="Ej: 0424-4212345"
pattern="^(0412|0414|0424|0416|0426)-\d{7}$" title="Formato: 0424-4212345" required><br><br>

<label for="correo">Correo Electrónico:</label>
<input type="email" id="correo" name="correo" placeholder="Ej: correo@ejemplo.com" required><br><br>

<p>Sexo:</p>
<label><input type="radio" name="sexo" value="M"> Masculino</label>
<label><input type="radio" name="sexo" value="F" checked> Femenino</label><br><br>

<p>Deportes:</p>
<label><input type="checkbox" name="deportes" value="futbol"> Fútbol</label>
<label><input type="checkbox" name="deportes" value="baloncesto"> Baloncesto</label>
<label><input type="checkbox" name="deportes" value="natacion"> Natación</label><br><br>

<label for="nivel_estudio">Nivel de Estudio (campo agregado):</label>
<select id="nivel_estudio" name="nivel_estudio" required>
<option value="" disabled selected>-- Elige una opción --</option>
<option value="bachiller">Bachiller</option>
<option value="tsu">Técnico Superior Universitario</option>
<option value="universitario">Universitario</option>
<option value="postgrado">Postgrado</option>
</select><br><br>

<label for="clave">Clave:</label>
<input type="password" id="clave" name="clave" placeholder="Ingrese su clave"
pattern="^(?=.*[A-Z])(?=.*\d).{8,}$" title="Mínimo 8 caracteres, 1 mayúscula y 1 número" required><br><br>

<label for="color_favorito">Color favorito:</label>
<input type="color" id="color_favorito" name="color_favorito" value="#000000"><br><br>

<input type="submit" value="Enviar">
<input type="reset" value="Reset">

</form>
<a href="index.html">volver a inicio</a>

</body>
</html>
